
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Свадебное приглашение</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Roboto:wght@300;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio autoplay loop>
        <source src="romantic.mp3" type="audio/mpeg">
        Ваш браузер не поддерживает аудио.
    </audio>
    <div class="container">
        <h1>Виктор и Виктория</h1>
        <p class="invitation-text">
            Мы рады пригласить вас на самый важный день в нашей жизни — день нашей свадьбы!<br><br>
            Церемония и праздничный ужин состоятся<br>
            <strong>16:30</strong>, по адресу:<br>
            <strong>г. Темрюк, ул. Кирова 6/1</strong>.<br><br>
            Мы будем счастливы разделить этот день с вами!
        </p>

        <form id="rsvp-form">
            <h2>Подтвердите участие</h2>
            <label>Ваше имя:</label>
            <input type="text" name="name" required><br>
            <label>Придёте ли вы?</label>
            <select name="attendance" required>
                <option value="Да">Да</option>
                <option value="Нет">Нет</option>
                <option value="Возможно">Возможно</option>
            </select><br>
            <label>Общее количество гостей: </label>
            <input type="number" name="guests" min="1" max="10"><br>
            <label>Комментарий:</label>
            <textarea name="comment"></textarea><br>
            <button type="submit">Отправить</button>
        </form>
        <p id="status-message"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
