<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Свадьба Виктора и Виктории</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Временный шрифт для загрузки */
    body {
        font-family: Georgia, serif;
    }
    h1, h2, h3, h4, h5, h6 {
        font-family: Georgia, serif;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Новый заголовок по макету -->
    <div class="hero-header">
      <div class="hero-names">
        <div class="name-line">В</div>
        <div class="name-line">ВИКТОРИЯ</div>
        <div class="name-line symbol">&</div>
        <div class="name-line">ВИКТОР</div>
      </div>
      <div class="hero-date">21 августа 2025</div>
      <div class="hero-subtitle">ЖДЕМ ВАС</div>
    </div>

    <h2 id="greeting">Добро пожаловать!</h2>
    
    <!-- Таймер обратного отсчета -->
    <div class="countdown-clean" id="countdown">
      <div class="unit">
        <div id="days">00</div>
        <label>дней</label>
      </div>
      <div class="unit">
        <div id="hours">00</div>
        <label>часов</label>
      </div>
      <div class="unit">
        <div id="minutes">00</div>
        <label>минут</label>
      </div>
      <div class="unit">
        <div id="seconds">00</div>
        <label>секунд</label>
      </div>
    </div>

    <!-- Остальная часть сайта без изменений -->
    <!-- ... -->
  </div>

  <script src="script.js"></script>
</body>
</html>
